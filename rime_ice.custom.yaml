patch:
  "engine/filters/@before 10": lua_filter@*en_spacer  # 英文词条上屏自动加空格（插入到 uniquifier 之前，若上游 filters 数量变化需同步调整 index）
  "speller/algebra/+":
    ### 模糊音
    - derive/^([zcs])h/$1/          # zh* ch* sh* 派生出 z* c* s*
    - derive/^([zcs])([^h])/$1h$2/  # z* c* s*    派生出 zh* ch* sh*
    - derive/eng$/en/
    - derive/en$/eng/
    - derive/in$/ing/
    - derive/ing$/in/
  custom_phrase/user_dict: rime_custom_phrase
  # custom_phrase/db_class: tabledb
  # translator/max_homophones: 7
  # translator/max_homographs: 7
